<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>열섬 예측</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1923;
  --surface:#162030;
  --surface2:#1e2d3d;
  --border:#2a3f55;
  --text:#e8f0f8;
  --muted:#7a9ab5;
  --accent:#ff6b35;
  --accent2:#3dd6f5;
  --grade-none:#3dd6f5;
  --grade-low:#4caf7d;
  --grade-mid:#f5c842;
  --grade-high:#ff8c42;
  --grade-severe:#ff3b3b;
}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:0;
  overflow-x:hidden;
}

/* Header */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(15,25,35,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;gap:10px;
}
.header-icon{
  width:32px;height:32px;
  background:linear-gradient(135deg,#ff6b35,#ff3b3b);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.header h1{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.header-sub{font-size:11px;color:var(--muted);margin-top:1px}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:#4caf7d;margin-left:auto;
  box-shadow:0 0 8px #4caf7d88;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* API 설정 */
.api-bar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:12px 20px;
  display:flex;gap:8px;align-items:center;
}
.api-bar input{
  flex:1;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 12px;
  font-size:12px;
  color:var(--text);
  font-family:'DM Mono',monospace;
}
.api-bar input::placeholder{color:var(--muted)}
.api-bar input:focus{outline:none;border-color:var(--accent2)}
.btn-sm{
  background:var(--accent2);
  color:#0f1923;
  border:none;
  border-radius:8px;
  padding:9px 14px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  font-family:'Noto Sans KR',sans-serif;
}

/* 탭 */
.tabs{
  display:flex;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 20px;
}
.tab{
  flex:1;padding:13px 0;
  font-size:13px;font-weight:500;
  color:var(--muted);
  background:none;border:none;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .2s;
  font-family:'Noto Sans KR',sans-serif;
}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}

/* 페이지 */
.page{display:none;padding:20px}
.page.active{display:block}

/* 입력 폼 */
.section-label{
  font-size:11px;font-weight:700;
  color:var(--muted);letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:12px;
}
.field{margin-bottom:16px}
.field label{
  display:flex;justify-content:space-between;
  font-size:13px;color:var(--muted);
  margin-bottom:6px;
}
.field label span{color:var(--accent2);font-family:'DM Mono',monospace;font-size:13px}
.field input[type=range]{
  width:100%;accent-color:var(--accent2);
  cursor:pointer;
}
.field input[type=number]{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  font-size:14px;
  color:var(--text);
  font-family:'DM Mono',monospace;
}
.field input[type=number]:focus{outline:none;border-color:var(--accent2)}

.coord-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.location-btn{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  color:var(--accent2);
  font-size:13px;font-weight:500;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-bottom:20px;
  font-family:'Noto Sans KR',sans-serif;
}
.location-btn:active{background:var(--border)}

.predict-btn{
  width:100%;
  background:linear-gradient(135deg,var(--accent),#ff3b3b);
  border:none;border-radius:12px;
  padding:16px;
  font-size:16px;font-weight:700;
  color:#fff;cursor:pointer;
  letter-spacing:-.3px;
  font-family:'Noto Sans KR',sans-serif;
  transition:opacity .15s,transform .1s;
}
.predict-btn:active{opacity:.85;transform:scale(.98)}
.predict-btn:disabled{opacity:.4;cursor:default}

/* 결과 카드 */
.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-top:20px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.uhi-main{text-align:center;padding:16px 0 20px}
.uhi-value{
  font-size:52px;font-weight:700;
  font-family:'DM Mono',monospace;
  line-height:1;
}
.uhi-unit{font-size:20px;color:var(--muted);margin-left:2px}
.uhi-grade-badge{
  display:inline-block;
  margin-top:10px;
  padding:5px 18px;
  border-radius:20px;
  font-size:14px;font-weight:700;
  letter-spacing:.02em;
}

.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-top:4px;
}
.stat-box{
  background:var(--surface2);
  border-radius:10px;padding:12px;
}
.stat-box .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.stat-box .val{font-size:18px;font-weight:700;font-family:'DM Mono',monospace}
.stat-box .val span{font-size:12px;font-weight:400;color:var(--muted)}

.weather-row{
  display:flex;gap:10px;
  margin-top:10px;
}
.weather-chip{
  flex:1;background:var(--surface2);
  border-radius:8px;padding:10px 8px;
  text-align:center;
}
.weather-chip .wlabel{font-size:10px;color:var(--muted);margin-bottom:4px}
.weather-chip .wval{font-size:14px;font-weight:700;font-family:'DM Mono',monospace}

/* 히스토리 */
.history-empty{
  text-align:center;padding:60px 20px;
  color:var(--muted);font-size:14px;
}
.history-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
}
.hist-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
}
.hist-info{flex:1}
.hist-loc{font-size:13px;font-weight:500}
.hist-time{font-size:11px;color:var(--muted);margin-top:2px}
.hist-uhi{font-family:'DM Mono',monospace;font-size:16px;font-weight:700}

/* 로딩 */
.loading{
  display:none;text-align:center;padding:30px;
  color:var(--muted);font-size:14px;
}
.spinner{
  width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--accent2);border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.err-msg{
  background:#ff3b3b18;border:1px solid #ff3b3b44;
  border-radius:10px;padding:12px 14px;
  font-size:13px;color:#ff7070;margin-top:16px;
  display:none;
}
.divider{height:1px;background:var(--border);margin:16px 0}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🌡</div>
  <div>
    <h1>열섬 예측</h1>
    <div class="header-sub">수도권 UHI Index</div>
  </div>
  <div class="status-dot" id="statusDot" title="API 연결 상태"></div>
</div>

<div class="api-bar">
  <input type="text" id="apiUrl" placeholder="https://xxxx.ngrok.io" />
  <button class="btn-sm" onclick="saveApi()">저장</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('predict',this)">예측</button>
  <button class="tab" onclick="switchTab('history',this)">기록</button>
</div>

<!-- 예측 탭 -->
<div class="page active" id="page-predict">

  <div class="section-label">📍 위치</div>
  <button class="location-btn" onclick="getLocation()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" opacity=".3"/></svg>
    현재 위치 자동 입력
  </button>
  <div class="coord-row">
    <div class="field">
      <label>위도 <span id="latVal">37.5172</span></label>
      <input type="number" id="lat" value="37.5172" step="0.0001" min="37.0" max="37.9">
    </div>
    <div class="field">
      <label>경도 <span id="lonVal">127.0473</span></label>
      <input type="number" id="lon" value="127.0473" step="0.0001" min="126.4" max="127.7">
    </div>
  </div>

  <div class="divider"></div>
  <div class="section-label">🌿 환경 변수</div>

  <div class="field">
    <label>녹지율 (NDVI) <span id="ndviVal">0.15</span></label>
    <input type="range" id="ndvi" min="0.05" max="0.85" step="0.01" value="0.15" oninput="updateSlider('ndvi','ndviVal',this.value)">
  </div>
  <div class="field">
    <label>건물 밀도 <span id="buildVal">0.85</span></label>
    <input type="range" id="build" min="0.05" max="0.95" step="0.01" value="0.85" oninput="updateSlider('build','buildVal',this.value)">
  </div>
  <div class="field">
    <label>불투수면적 비율 <span id="impervVal">0.90</span></label>
    <input type="range" id="imperv" min="0.10" max="0.95" step="0.01" value="0.90" oninput="updateSlider('imperv','impervVal',this.value)">
  </div>
  <div class="field">
    <label>인구 밀도 (명/km²) <span id="popVal">22000</span></label>
    <input type="range" id="pop" min="200" max="30000" step="100" value="22000" oninput="updateSlider('pop','popVal',this.value)">
  </div>

  <button class="predict-btn" id="predictBtn" onclick="runPredict()">🔍 열섬 예측</button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    기상 데이터 수집 및 예측 중...
  </div>

  <div class="err-msg" id="errMsg"></div>

  <div id="resultBox"></div>
</div>

<!-- 기록 탭 -->
<div class="page" id="page-history">
  <div class="section-label">📋 예측 기록</div>
  <div id="historyList"></div>
</div>

<script>
let API_URL = localStorage.getItem('uhi_api') || '';
let history = JSON.parse(localStorage.getItem('uhi_history') || '[]');

// 초기화
document.getElementById('apiUrl').value = API_URL;
renderHistory();
if(API_URL) checkHealth();

function saveApi(){
  API_URL = document.getElementById('apiUrl').value.trim().replace(/\/$/,'');
  localStorage.setItem('uhi_api', API_URL);
  checkHealth();
}

const NGROK_HEADERS = {
  'Content-Type': 'application/json',
  'ngrok-skip-browser-warning': 'true'
};

async function checkHealth(){
  const dot = document.getElementById('statusDot');
  try{
    const r = await fetch(API_URL + '/health', {
      headers: NGROK_HEADERS,
      signal: AbortSignal.timeout(4000)
    });
    dot.style.background = r.ok ? '#4caf7d' : '#ff6b35';
    dot.style.boxShadow = r.ok ? '0 0 8px #4caf7d88' : '0 0 8px #ff6b3588';
  } catch{
    dot.style.background = '#ff3b3b';
    dot.style.boxShadow = '0 0 8px #ff3b3b88';
  }
}

function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
  if(name==='history') renderHistory();
}

function updateSlider(id, outId, val){
  document.getElementById(outId).textContent = id==='pop' ? Number(val).toLocaleString() : parseFloat(val).toFixed(2);
}

function getLocation(){
  if(!navigator.geolocation){alert('위치 접근 불가'); return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const la = pos.coords.latitude.toFixed(4);
    const lo = pos.coords.longitude.toFixed(4);
    document.getElementById('lat').value = la;
    document.getElementById('lon').value = lo;
    document.getElementById('latVal').textContent = la;
    document.getElementById('lonVal').textContent = lo;
  }, ()=>alert('위치를 가져올 수 없어요.'));
}

function gradeColor(g){
  const map={없음:'var(--grade-none)',낮음:'var(--grade-low)',중간:'var(--grade-mid)',높음:'var(--grade-high)',심각:'var(--grade-severe)'};
  return map[g]||'var(--muted)';
}

async function runPredict(){
  if(!API_URL){showErr('API URL을 먼저 입력하세요.'); return;}

  const body = {
    lat: parseFloat(document.getElementById('lat').value),
    lon: parseFloat(document.getElementById('lon').value),
    ndvi: parseFloat(document.getElementById('ndvi').value),
    build_dens: parseFloat(document.getElementById('build').value),
    imperv_surf: parseFloat(document.getElementById('imperv').value),
    pop_density: parseFloat(document.getElementById('pop').value),
  };

  document.getElementById('predictBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('errMsg').style.display = 'none';
  document.getElementById('resultBox').innerHTML = '';

  try{
    const res = await fetch(API_URL+'/predict', {
      method:'POST',
      headers: NGROK_HEADERS,
      body: JSON.stringify(body),
      signal: AbortSignal.timeout(15000)
    });
    if(!res.ok) throw new Error(`서버 오류 ${res.status}`);
    const d = await res.json();
    showResult(d);
    saveHistory(d, body);
  } catch(e){
    showErr(e.message.includes('timeout') ? '요청 시간 초과 (15초). 코랩 서버가 실행 중인지 확인하세요.' : e.message);
  } finally{
    document.getElementById('predictBtn').disabled = false;
    document.getElementById('loading').style.display = 'none';
  }
}

function showResult(d){
  const c = gradeColor(d.uhi_grade);
  const sign = d.uhi_index >= 0 ? '+' : '';
  document.getElementById('resultBox').innerHTML = `
    <div class="result-card">
      <div class="uhi-main">
        <div class="uhi-value" style="color:${c}">${sign}${d.uhi_index.toFixed(3)}<span class="uhi-unit">°C</span></div>
        <div class="uhi-grade-badge" style="background:${c}22;color:${c}">열섬 ${d.uhi_grade}</div>
      </div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="label">현재 기온</div>
          <div class="val">${d.current_temp.toFixed(1)}<span> °C</span></div>
        </div>
        <div class="stat-box">
          <div class="label">체감 도시 기온</div>
          <div class="val" style="color:${c}">${d.estimated_urban_temp.toFixed(1)}<span> °C</span></div>
        </div>
      </div>
      <div class="weather-row">
        <div class="weather-chip">
          <div class="wlabel">습도</div>
          <div class="wval">${d.weather.humidity.toFixed(0)}<span style="font-size:10px;color:var(--muted)">%</span></div>
        </div>
        <div class="weather-chip">
          <div class="wlabel">풍속</div>
          <div class="wval">${d.weather.windspeed.toFixed(1)}<span style="font-size:10px;color:var(--muted)">m/s</span></div>
        </div>
        <div class="weather-chip">
          <div class="wlabel">복사열</div>
          <div class="wval">${Math.round(d.weather.radiation)}<span style="font-size:10px;color:var(--muted)">W</span></div>
        </div>
      </div>
      <div style="margin-top:14px;font-size:11px;color:var(--muted);text-align:center">
        ${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}
      </div>
    </div>
  `;
}

function showErr(msg){
  const el = document.getElementById('errMsg');
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}

function saveHistory(d, body){
  const item = {
    ...d, ...body,
    time: new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
  };
  history.unshift(item);
  if(history.length > 30) history.pop();
  localStorage.setItem('uhi_history', JSON.stringify(history));
}

function renderHistory(){
  const el = document.getElementById('historyList');
  if(!history.length){
    el.innerHTML = '<div class="history-empty">예측 기록이 없어요<br>예측 탭에서 먼저 예측해보세요</div>';
    return;
  }
  el.innerHTML = history.map(h=>{
    const c = gradeColor(h.uhi_grade);
    const sign = h.uhi_index>=0?'+':'';
    return `
      <div class="history-item">
        <div class="hist-dot" style="background:${c}"></div>
        <div class="hist-info">
          <div class="hist-loc">${h.lat.toFixed(3)}, ${h.lon.toFixed(3)}</div>
          <div class="hist-time">${h.time} · 열섬 ${h.uhi_grade}</div>
        </div>
        <div class="hist-uhi" style="color:${c}">${sign}${h.uhi_index.toFixed(2)}°C</div>
      </div>
    `;
  }).join('');
}

// 좌표 입력 동기화
document.getElementById('lat').addEventListener('input',e=>document.getElementById('latVal').textContent=parseFloat(e.target.value).toFixed(4));
document.getElementById('lon').addEventListener('input',e=>document.getElementById('lonVal').textContent=parseFloat(e.target.value).toFixed(4));
</script>
</body>
</html>
